# Minimum compute requirements for the MASXAI subnet.
#
# Both roles are I/O-bound (HTTP calls to the protocol backend, lightweight
# NaCl/Fernet encryption) -- no local model inference happens on either the
# miner or the validator, so no GPU is required for either role.

version: '2.0'

compute_spec:

  miner:

    cpu:
      min_cores: 2
      min_speed: 2.0
      recommended_cores: 4
      recommended_speed: 2.5
      architecture: "x86_64"

    gpu:
      required: False

    memory:
      min_ram: 2
      min_swap: 2
      recommended_swap: 4
      ram_type: "DDR4"

    storage:
      min_space: 5
      recommended_space: 10
      type: "SSD"
      min_iops: 500
      recommended_iops: 1000

    os:
      name: "Ubuntu"
      version: 22.04

  validator:

    cpu:
      min_cores: 2
      min_speed: 2.0
      recommended_cores: 4
      recommended_speed: 2.5
      architecture: "x86_64"

    gpu:
      required: False

    memory:
      min_ram: 4
      min_swap: 2
      recommended_swap: 4
      ram_type: "DDR4"

    storage:
      min_space: 10
      recommended_space: 20
      type: "SSD"
      min_iops: 500
      recommended_iops: 1000

    os:
      name: "Ubuntu"
      version: 22.04

network_spec:
  bandwidth:
    download: 20   # Mbps -- HTTP calls to the protocol backend, no model downloads
    upload: 10     # Mbps
